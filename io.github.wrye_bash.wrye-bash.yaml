id: io.github.wrye_bash.wrye-bash
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: wrye-bash
finish-args:
  - --share=ipc # Used by X11
  - --socket=x11
  - --socket=wayland
  - --device=dri # Used by WebKit
  - --filesystem=home/.var/app/com.valvesoftware.Steam/data/Steam:rw
  - --filesystem=home/.steam/root:rw
modules:
  - name: 7-zip
    buildsystem: simple
    subdir: CPP/7zip/Bundles/Alone2
    build-commands:
      - make -j "$FLATPAK_BUILDER_N_JOBS" -f makefile.gcc
      - install -Dm755 ./_o/7zz -t "${FLATPAK_DEST}/bin"
      - ln -s "${FLATPAK_DEST}/bin/7zz" "${FLATPAK_DEST}/bin/7za"
      - ln -s "${FLATPAK_DEST}/bin/7zz" "${FLATPAK_DEST}/bin/7z"
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/archive/refs/tags/26.04.tar.gz
        sha256: 48fdc6dfe879ee2db867bb07f19c4a9406bfea01d51f48785b6c7a137881e25c
        x-checker-data:
          type: anitya
          project-id: 17875
          stable-only: true
          url-template: https://github.com/ip7z/7zip/archive/refs/tags/$version.tar.gz
      - type: patch
        path: 7zip-gcc-16-fix.patch

  - python3-requirements-scripts.yaml
  - python3-requirements.yaml

  - name: xdg-open # Workaround subprocess.call bug
    buildsystem: simple
    build-options:
      strip: true
    build-commands:
      - install -Dm755 /usr/bin/xdg-open -t "${FLATPAK_DEST}/bin"

  - name: wrye-bash
    buildsystem: simple
    build-commands:
      - install -Dm755 io.github.wrye_bash.wrye-bash.sh "${FLATPAK_DEST}/bin/wrye-bash"
      - install -Dm644 io.github.wrye_bash.wrye-bash.desktop -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 Mopy/bash/images/bash.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.wrye_bash.wrye-bash.svg"
      - install -Dm644 boot-settings_default.toml "${FLATPAK_DEST}/share/wrye-bash/boot-settings_default.toml"

      - python scripts/compile_l10n.py
      - python -O -m compileall Mopy/bash
      - for game_name in Enderal Fallout3 FalloutNV Fallout4
        Morrowind Oblivion Skyrim SkyrimSE Starfield; do
        mkdir -p Mopy/taglists/"$game_name";
        cp -a "$game_name"_masterlist.yaml Mopy/taglists/"$game_name"/taglist.yaml; done

      - cp -a Mopy/* "${FLATPAK_DEST}/share/wrye-bash/"
      - install -Dm644 LICENSE.md "${FLATPAK_DEST}/share/licenses/wrye-bash/LICENSE.md"
      - install -Dm644 Mopy/LICENSE-THIRD-PARTY "${FLATPAK_DEST}/share/licenses/wrye-bash/LICENSE-THIRD-PARTY"
    sources:
      - type: archive
        url: https://github.com/wrye-bash/wrye-bash/archive/refs/tags/v315.tar.gz
        sha256: 785d5b41b5d7de3e4ed23e8762a753db2715469e37dadb3995ab3d6819b218e3
      - type: patch
        paths:
          - 0001-write_BashBugDump_to_xdg_data_home.patch
          - 0002-detect_flatpak_steam.patch
          - 0003-read_bash_ini_from_xdg_config_home.patch
          - 0004-change_backup_files.patch
          - 0005-disable_update_checking.patch
          - 0006-change_default_temp_dir.patch
          - 0007-change_game_not_found_dialog.patch
      - type: file
        path: io.github.wrye_bash.wrye-bash.sh
      - type: file
        path: io.github.wrye_bash.wrye-bash.desktop
      - type: file
        path: boot-settings_default.toml
      - taglists.yaml
    cleanup:
      - /share/wrye-bash/bash/tests
      - /share/wrye-bash/bash/l10n/*.po
      - /share/wrye-bash/bash/l10n/template.pot
      - /share/wrye-bash/bash/compiled
      - /share/wrye-bash/LICENSE-THIRD-PARTY
